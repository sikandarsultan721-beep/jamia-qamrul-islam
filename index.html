<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jamia Qamrul Islam</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7f6;
    color: #222;
}

header {
    background: #075e54;
    color: white;
    text-align: center;
    padding: 35px 15px;
}

header h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

header p {
    font-size: 16px;
}

.container {
    max-width: 700px;
    margin: 30px auto;
    padding: 0 15px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    margin-bottom: 20px;
}

.card h2 {
    color: #075e54;
    margin-bottom: 15px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    margin-bottom: 12px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #075e54;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background: #064d45;
}

#result {
    display: none;
    margin-top: 20px;
}

.student {
    text-align: center;
}

.student img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    margin: 15px;
    border: 4px solid #075e54;
}

.info {
    text-align: left;
    line-height: 2;
    margin-top: 10px;
}

footer {
    text-align: center;
    background: #075e54;
    color: white;
    padding: 20px;
    margin-top: 40px;
}
</style>
</head>

<body>

<header>
    <h1>جامعہ قمر الاسلام</h1>
    <p>Jamia Qamrul Islam</p>
    <p>Student Online Portal</p>
</header>

<div class="container">

    <div class="card">
        <h2>Student Result & Profile</h2>

        <p style="margin-bottom:15px;">
            Enter the student's Roll Number
        </p>

        <input
            type="text"
            id="rollNumber"
            placeholder="Enter Roll Number"
        >

        <button onclick="searchStudent()">
            Search Student
        </button>

        <div id="result"></div>
    </div>

</div>

<footer>
    © 2026 Jamia Qamrul Islam
</footer>

<script>

function searchStudent() {

    var roll = document.getElementById("rollNumber").value;

    var result = document.getElementById("result");

    if (roll === "1001") {

        result.style.display = "block";

        result.innerHTML = `
        <div class="student">

            <h2>Student Profile</h2>

            <img
            src="https://via.placeholder.com/120"
            alt="Student Photo">

            <div class="info">

                <p><b>Name:</b> Muhammad Ahmad</p>

                <p><b>Father Name:</b> Muhammad Ali</p>

                <p><b>Roll Number:</b> 1001</p>

                <p><b>Class:</b> Middle</p>

                <p><b>Subjects:</b> Urdu, English, Mathematics, Islamiat</p>

                <p><b>Result:</b> Passed</p>

            </div>

        </div>
        `;

    } else {

        result.style.display = "block";

        result.innerHTML = `
        <p style="color:red; text-align:center;">
        No student found. Please check the Roll Number.
        </p>
        `;
    }
}

</script>

</body>
</html>
