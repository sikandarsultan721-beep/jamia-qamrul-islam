<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
body{background:#f7faf8;color:#18352c}
.top-strip{background:#07553d;color:#fff;font-size:13px;padding:9px 15px}
.top-strip-inner{max-width:1250px;margin:auto;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
header{background:#fff;color:#12372e;border-bottom:1px solid #dfe7e3;box-shadow:0 3px 14px rgba(0,0,0,.08);padding:10px 15px 0}
.header-inner{max-width:1250px;margin:auto;display:flex;align-items:center;gap:16px;min-height:86px}
.logo-box{width:68px;height:68px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.logo-box img{width:100%;height:100%;object-fit:contain}
.brand h1{font-size:27px;color:#0b4438;font-family:Georgia,serif}
.brand p{font-size:13px;margin-top:5px;color:#52665f}
nav{max-width:1250px;margin:auto;display:flex;flex-wrap:wrap;gap:8px;padding:0 0 12px}
nav button{border:1px solid #cddfd7;background:#f8fbf9;color:#18352c;padding:10px 15px;border-radius:7px;cursor:pointer;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.08)}
nav button:hover{background:#e7f3ee;color:#07553d;border-color:#9fc8b7}
.container{max-width:1250px;margin:auto;padding:22px 15px}
.hero{position:relative;min-height:330px;border-radius:18px;overflow:hidden;margin-bottom:22px;background:linear-gradient(90deg,rgba(3,42,32,.90),rgba(3,42,32,.58)),url('file_0000000043bc8206851260d941647475.png') center/cover;display:flex;align-items:center;padding:38px}
.hero-content{max-width:610px;color:#fff}
.hero-badge{display:inline-block;background:#1b8b69;padding:9px 17px;border-radius:22px;font-weight:bold;margin-bottom:14px}
.hero h2{font-family:Georgia,serif;font-size:38px;line-height:1.15;margin-bottom:12px;color:#fff}
.hero p{color:#e8f1ed;line-height:1.7;margin-bottom:18px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.hero-actions button{border:1px solid rgba(255,255,255,.35);background:#fff;color:#07553d;padding:11px 18px;border-radius:25px;font-weight:bold;cursor:pointer}
.hero-actions button:hover{background:#dff1e9}
.section{display:none}.section.active{display:block}
.card{background:#fff;border-radius:15px;padding:22px;margin-bottom:20px;box-shadow:0 5px 22px rgba(0,0,0,.07);border:1px solid #e2ebe6}
.card h2,.card h3{color:#07553d;margin-bottom:15px}
input,select{width:100%;padding:13px;border:1px solid #cdd6d0;border-radius:8px;margin:6px 0 12px;font-size:15px;outline:none}
input:focus,select:focus{border-color:#0a7654;box-shadow:0 0 0 2px rgba(10,118,84,.1)}
button.primary{background:linear-gradient(135deg,#07553d,#0a7654);color:#fff;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold}
button.gold{background:linear-gradient(135deg,#b88a18,#e0bd50);color:#172318;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold}
button.danger{background:#a52b2b;color:#fff;border:none;padding:8px 12px;border-radius:7px;cursor:pointer}
.message{margin-top:10px;padding:10px;border-radius:7px;display:none}.success{background:#e6f5eb;color:#146238}.error{background:#fde8e8;color:#a32626}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.slider-card{padding:14px;background:#fff;border:1px solid #dce8e2}
.slider-title{text-align:center;color:#07553d;font-size:21px;font-weight:bold;margin:4px 0 12px}
.slider-subtitle{text-align:center;color:#777;font-size:13px;margin-bottom:12px}
.slider{position:relative;width:100%;height:430px;border-radius:14px;overflow:hidden;background:#073827;border:3px solid #c7a43a;box-shadow:0 8px 25px rgba(0,0,0,.16)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}.slide.active{opacity:1}.slide img{width:100%;height:100%;object-fit:cover;display:block}
.slider-caption{position:absolute;left:0;right:0;bottom:0;padding:12px 15px;color:#fff;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.8));font-weight:bold}
.slider-dots{display:flex;justify-content:center;gap:7px;margin-top:10px}.slider-dot{width:9px;height:9px;border-radius:50%;background:#c9c9c9;cursor:pointer}.slider-dot.active{background:#b88a18;transform:scale(1.2)}
.features-heading{text-align:center;margin:28px 0 18px}.features-heading h2{font-family:Georgia,serif;font-size:30px;color:#0b4d40}.features-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.feature-card{background:#fff;border:1px solid #e2ebe6;border-radius:14px;padding:24px 16px;text-align:center;box-shadow:0 5px 18px rgba(0,0,0,.06)}.feature-icon{font-size:30px;margin-bottom:10px}.feature-card h3{margin:0;color:#0b4d40}
/* Result/Admin styles */
.result-wrap{display:none}.result-card:before{content:"جامعہ قمر الاسلام";position:absolute;left:50%;top:54%;transform:translate(-50%,-50%) rotate(-28deg);font-family:Georgia,serif;font-size:clamp(28px,5vw,58px);font-weight:bold;white-space:nowrap;color:rgba(7,85,61,.06);pointer-events:none;z-index:0}.result-card .result-top,.result-card .result-body,.result-card .result-footer{position:relative;z-index:1}.result-actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.result-card{width:100%;max-width:900px;margin:auto;background:#fff;border:7px solid #07553d;outline:2px solid #c7a43a;box-shadow:0 10px 35px rgba(0,0,0,.18);position:relative;overflow:hidden}.result-top{background:linear-gradient(135deg,#063b2b,#07553d,#0b7654);color:#fff;padding:25px;border-bottom:5px solid #d4af37;position:relative}.result-top:after{content:"";position:absolute;left:18px;right:18px;bottom:8px;height:1px;background:#e2c35d}.result-title{text-align:center}.result-title .small{color:#e8cf72;font-size:13px;letter-spacing:2px;font-weight:bold}.result-title h1{font-size:30px;margin:7px 0;color:#fff4bd;letter-spacing:.5px}.result-title p{font-size:13px;color:#fff}.result-body{padding:25px}.student-head{display:grid;grid-template-columns:1fr 150px;gap:20px;align-items:start;margin-bottom:22px}.student-info{border:2px solid #d1b04b;border-radius:10px;overflow:hidden}.student-info-row{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid #dfe3df}.student-info-row:last-child{border-bottom:0}.student-info-row strong{background:#edf4ef;color:#07553d;padding:11px}.student-info-row span{padding:11px;font-weight:bold;color:#222}.photo-box{width:150px;height:175px;border:4px solid #c7a43a;border-radius:10px;background:#eef1ed;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#777;font-size:12px;text-align:center}.photo-box img{width:100%;height:100%;object-fit:cover}.marks-title{background:#07553d;color:#f7df79;padding:11px 15px;font-size:17px;font-weight:bold;border-radius:8px 8px 0 0}.marks-table{width:100%;border-collapse:collapse;border:2px solid #07553d;margin-bottom:20px}.marks-table th{background:#d5b451;color:#132319;padding:12px 8px;border:1px solid #96751c;font-size:14px}.marks-table td{padding:13px 8px;border:1px solid #bfc8c2;text-align:center;font-weight:bold;color:#151515;font-size:16px}.marks-table td:first-child{text-align:left;color:#07553d}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.summary-box{border:2px solid #c8a63e;border-radius:9px;padding:12px 5px;text-align:center;background:#fbfaf3}.summary-box label{display:block;color:#07553d;font-size:11px;font-weight:bold;margin-bottom:5px}.summary-box strong{display:block;font-size:20px;color:#111}.status{padding:7px 15px;border-radius:20px;display:inline-block;background:#dff2e5;color:#116134}.signatures{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;margin-top:40px}.signature{text-align:center;padding-top:25px;border-top:1px solid #555;color:#333;font-size:12px}.result-footer{background:#07553d;color:#fff;text-align:center;padding:10px;font-size:11px;border-top:4px solid #d4af37}.student-list{overflow-x:auto}.student-list table{width:100%;border-collapse:collapse}.student-list th,.student-list td{border:1px solid #d5ddd7;padding:9px;text-align:left;white-space:nowrap}.student-list th{background:#07553d;color:#fff}.notice{border-left:5px solid #d1ac3c;background:#f9faf6;padding:14px;border-radius:7px;margin-bottom:10px}.file-note{font-size:12px;color:#777;margin-top:-5px;margin-bottom:10px}
.subject-settings{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:8px 0 18px}.subject-toggle{border:1px solid #d7e1dc;border-radius:10px;padding:12px;background:#f8fbf9}.subject-toggle label{display:flex;align-items:center;gap:8px;font-weight:bold;color:#07553d;cursor:pointer}.subject-toggle input{width:auto;margin:0;accent-color:#07553d}
@media(max-width:850px){.features-grid{grid-template-columns:repeat(2,1fr)}.subject-settings{grid-template-columns:repeat(2,1fr)}.hero h2{font-size:32px}}
@media(max-width:650px){.top-strip-inner{justify-content:center}.header-inner{align-items:center}.brand h1{font-size:20px}.info-grid{grid-template-columns:1fr}.slider{height:250px}.result-body{padding:12px}.student-head{grid-template-columns:1fr 110px}.photo-box{width:110px;height:135px}.student-info-row{grid-template-columns:105px 1fr}.student-info-row strong,.student-info-row span{padding:8px;font-size:12px}.result-title h1{font-size:22px}.summary{grid-template-columns:repeat(2,1fr)}.signatures{grid-template-columns:1fr;gap:35px}.marks-table th,.marks-table td{font-size:12px;padding:9px 4px}.hero{padding:28px 20px;min-height:360px}.features-grid,.subject-settings{grid-template-columns:1fr}.hero h2{font-size:28px}}

/* Premium reference-style result card */
.result-card{border:8px double #c9a333;outline:3px solid #07553d;border-radius:30px 30px 24px 24px;background:#fffdf5;box-shadow:inset 0 0 0 3px #f5e8b5,0 8px 26px rgba(0,0,0,.16);padding:8px}
.result-card:after{content:"❦";position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:25px;color:#bd9225;z-index:4;background:#fffdf5;padding:0 10px}
.result-top{background:linear-gradient(120deg,#fffdf5,#fff 50%,#f8f1dc);color:#07553d;border-bottom:3px solid #c7a02e;padding:14px 18px 10px}
.result-top:after{display:none}.result-brand-row{display:grid;grid-template-columns:125px 1fr;align-items:center;gap:12px;max-width:760px;margin:auto}.result-logo{width:115px;height:125px;object-fit:contain;mix-blend-mode:multiply}.result-title{text-align:center}.result-title .result-urdu{font-family:Georgia,'Noto Naskh Arabic',serif;font-size:27px;font-weight:bold;color:#07553d;line-height:1.25;margin-bottom:2px}.result-title h1{font-family:Georgia,serif;font-size:29px;color:#07553d;margin:3px 0;letter-spacing:.2px}.result-title .small{color:#ad811b;font-size:14px;letter-spacing:1.4px;font-weight:bold}.result-title p{color:#07553d;font-family:Georgia,serif;font-weight:bold;font-size:14px;margin:5px 0}.result-flourish{color:#c39a2d;font-size:13px;letter-spacing:1px}.result-body{padding:16px 18px 18px;background:linear-gradient(0deg,rgba(255,253,245,.9),rgba(255,255,255,.96))}.result-card:before{font-size:52px;color:rgba(7,85,61,.055);transform:translate(-50%,-50%) rotate(-28deg)}.student-info{border:2px solid #c9a33c;border-radius:8px}.student-info-row{grid-template-columns:145px 1fr}.student-info-row strong{background:#07553d;color:#fff;padding:9px 12px;border-right:3px solid #d4af37}.student-info-row span{padding:9px 12px;background:rgba(247,248,243,.9)}.photo-box{border:4px solid #c9a33c;border-radius:0;width:145px;height:165px;background:#fff}.marks-title{background:#07553d;color:#fff4bd;text-align:center;border:2px solid #c9a33c;border-radius:22px;padding:8px 12px;margin:0 auto 8px;max-width:460px;letter-spacing:.5px}.marks-table{border:2px solid #07553d;border-radius:10px;overflow:hidden;margin-bottom:13px}.marks-table th{background:#07553d;color:#fff7d8;border-color:#c9a33c;padding:9px 6px}.marks-table td{padding:9px 6px;background:rgba(255,255,255,.82);font-size:15px}.marks-table tbody tr:nth-child(even) td{background:#eef3ef}.summary{gap:7px;margin:14px 0}.summary-box{border:3px double #c9a33c;border-radius:0;background:#fffdf5;padding:9px 3px;box-shadow:inset 0 0 0 2px #f4e8c4}.summary-box label{font-family:Georgia,serif;font-size:10px;letter-spacing:.4px}.summary-box strong{color:#07553d;font-family:Georgia,serif;font-size:21px}.status{background:#07553d;color:#fff3bb;border:3px double #d4af37;border-radius:22px;font-size:23px;font-weight:bold;letter-spacing:2px;padding:5px 38px}.result-signatures{display:grid;grid-template-columns:1fr 1fr;gap:65px;margin:30px 25px 8px}.signature{text-align:center;color:#073f2f;font-family:Georgia,serif;font-size:14px}.signature-line{display:block;border-top:2px solid #c7a02e;margin:0 0 7px;height:1px}.signature strong{font-weight:bold}.result-footer{display:none}
@media(max-width:650px){.result-card{padding:5px;border-width:5px;border-radius:18px}.result-brand-row{grid-template-columns:75px 1fr;gap:6px}.result-logo{width:72px;height:88px}.result-title .result-urdu{font-size:19px}.result-title h1{font-size:18px}.result-title .small{font-size:9px;letter-spacing:.5px}.result-title p{font-size:10px}.result-flourish{font-size:8px}.result-body{padding:10px 7px}.student-head{grid-template-columns:1fr 92px;gap:7px}.photo-box{width:92px;height:120px}.student-info-row{grid-template-columns:95px 1fr}.student-info-row strong,.student-info-row span{font-size:10px;padding:7px 5px}.marks-table th,.marks-table td{font-size:10px;padding:6px 2px}.summary-box strong{font-size:15px}.summary-box label{font-size:8px}.result-signatures{gap:25px;margin:22px 8px 8px}.signature{font-size:11px}.status{font-size:18px;padding:4px 22px}}
</style>
